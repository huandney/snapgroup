# Configuração do snapgroup (/etc/snapgroup.conf)
# Formato shell-like KEY=valor. Linhas vazias e iniciadas por # são ignoradas.

# Quantos checkpoints automáticos manter vivos. Automático é o salvo com o
# nome padrão (Enter no `snapg save`, ou save sem terminal); ao salvar, os
# automáticos além dos N mais novos vão para a lixeira. Checkpoints com nome
# digitado, renomeados ou vindos do Regret são fixos: não contam e não saem
# sozinhos. 0 = ilimitado (sem cleanup automático). Os checkpoints do pacman
# têm fila própria (KEEP_PACMAN) e não contam aqui.
KEEP_GROUPS=0

# Quantos checkpoints do pacman (um por transação, criados pelo hook) manter
# vivos. Os além dos N mais novos vão para a lixeira, como os automáticos.
# Renomear um deles o fixa. 0 = ilimitado.
KEEP_PACMAN=20

# Dias que um grupo fica na lixeira antes de ser apagado de vez. O purge roda
# de carona em save/delete. Use `snapg delete --purge` para apagar na hora.
TRASH_PRUNE_DAYS=15
